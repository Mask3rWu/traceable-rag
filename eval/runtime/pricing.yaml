# 模型单价表（成本 = 各档 token 数 × 单价，单位：人民币元 / 百万 token）
# 按 RESEARCH_MODEL 的模型名匹配。未列出的模型成本记为 null（不编造 0）。
#
# 说明：DeepSeek 服务端自动缓存 prompt 前缀，usage 会返回
# prompt_cache_hit_tokens / prompt_cache_miss_tokens 两档。
# input 即 cache miss 档单价（兜底）：
#   有缓存字段时，命中 token 按 input_cache_hit 计、未命中 token 按 input 计；
#   未返回缓存字段（或未命中未命中=0）时全部按 input 计。
# 价格按开发用模型（deepseek-v4-flash）实际计费填写（元/百万 token）。
deepseek-v4-flash:
  input: 3
  input_cache_hit: 0.025
  output: 6
